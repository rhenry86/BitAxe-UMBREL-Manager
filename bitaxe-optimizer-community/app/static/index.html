<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Bitaxe Optimizer</title>
<style>body{margin:0;background:#111214;color:#eee;font:15px system-ui}main{max-width:1200px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{margin:0}.sub{color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.card{background:#1b1c20;border:1px solid #303238;border-radius:18px;padding:20px}.top,.row{display:flex;justify-content:space-between;align-items:center}.pill{padding:5px 9px;border-radius:20px;background:#333}.on{background:#173b27;color:#8be2ad}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.metric b{display:block;font-size:21px}.metric span{color:#999;font-size:12px}.bar{height:7px;background:#303238;border-radius:8px;overflow:hidden;margin:7px 0 14px}.fill{height:100%;background:#eee}.reason{color:#aaa;font-size:12px;min-height:32px;margin:15px 0}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}button.dark{background:#303238;color:#eee}.actions{display:flex;gap:8px}dialog{background:#1b1c20;color:#eee;border:1px solid #444;border-radius:16px;padding:22px}input{display:block;width:95%;margin:7px 0 14px;padding:10px;background:#111;color:#fff;border:1px solid #444;border-radius:8px}</style>
<main><header><div><h1>Bitaxe Optimizer</h1><div class=sub>Adaptive efficiency & thermal control</div></div><button onclick="d.showModal()">+ Add miner</button></header><section id=g class=grid></section></main>
<dialog id=d><h2>Add Bitaxe</h2><input id=n placeholder="Name"><input id=h placeholder="192.168.1.104"><button onclick="add()">Add</button> <button class=dark onclick="d.close()">Cancel</button></dialog>
<script>
const api=(u,o)=>fetch(u,o).then(r=>r.json());const e=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){let ms=await api('/api/miners');g.innerHTML=ms.map(m=>{let t=m.telemetry||{},s=m.settings||{};return `<article class=card><div class=top><div><b>${e(m.name)}</b><div class=sub>${e(m.host)}</div></div><span class="pill ${m.online?'on':''}">${m.online?'ONLINE':'OFFLINE'}</span></div><div class=metrics><div class=metric><b>${t.hashrate?.toFixed(2)||'—'}</b><span>TH/s</span></div><div class=metric><b>${t.power?.toFixed(0)||'—'}</b><span>W</span></div><div class=metric><b>${t.jth?.toFixed(1)||'—'}</b><span>J/TH</span></div></div><div class=row><span>ASIC ${t.temp?.toFixed(1)||'—'}°C</span><span>Target ${s.asic_temp_target}°C</span></div><div class=bar><div class=fill style="width:${Math.min(100,(t.temp||0)/s.asic_temp_target*100)}%"></div></div><div class=row><span>Fan ${t.fan?.toFixed(0)||'—'}%</span><span>Target ${s.fan_target}%</span></div><div class=bar><div class=fill style="width:${Math.min(100,t.fan||0)}%"></div></div><div class=row><span>Frequency</span><b>${t.frequency??'—'} MHz</b></div><div class=row><span>Voltage</span><b>${t.voltage??'—'} mV</b></div><div class=reason>${e(m.reason||'Idle')}</div><div class=actions><button onclick="toggle(${m.id})">Optimize / Pause</button><button class=dark onclick="removeMiner(${m.id})">Remove</button></div></article>`}).join('')}
async function add(){if(!n.value||!h.value)return;await api('/api/miners',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n.value,host:h.value})});d.close();load()}
async function toggle(id){let m=(await api('/api/miners')).find(x=>x.id===id);await api('/api/miners/'+id+'/'+(m?.reason==='Optimizer paused'?'optimize':'stop'),{method:'POST'});load()}
async function removeMiner(id){if(confirm('Remove miner?')){await api('/api/miners/'+id,{method:'DELETE'});load()}}load();setInterval(load,5000)
</script>
