services:
  app_proxy:
    environment:
      APP_HOST: bitaxe-optimizer_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "true"
    depends_on:
      - web
  web:
    image: ghcr.io/YOUR_GITHUB_USER/YOUR_REPO:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
volumes:
  data:
